
name: ZEMY ANIME - Project Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Android Project
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== PROJECT FILES ==="
          find . -maxdepth 5 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      - name: Check Gradle Wrapper
        run: |
          WRAPPER="$(find . -maxdepth 5 -type f -name gradlew | head -n 1)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle Wrapper not found"
            exit 1
          fi
          echo "Found: $WRAPPER"
          chmod +x "$WRAPPER"
          "$WRAPPER" --version

      - name: Check Android module
        run: |
          if find . -maxdepth 6 -type f \
            -path "*/app/build.gradle*" | grep -q .; then
            echo "Android app module found"
          else
            echo "::error::app/build.gradle or app/build.gradle.kts not found"
            exit 1
          fi

      - name: Check Kotlin and Java files
        run: |
          echo "=== SOURCE FILES ==="
          find . -type f \( -name "*.kt" -o -name "*.java" \) | head -n 100

      - name: Check Gradle configuration
        run: |
          WRAPPER="$(find . -maxdepth 5 -type f -name gradlew | head -n 1)"
          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"
          ./gradlew tasks --all --stacktrace
          
