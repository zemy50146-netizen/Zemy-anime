services:
  - type: web
    name: zemy-anime-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: ZEMY_ADMIN_TOKEN
        generateValue: true
      - key: ZEMY_DATA_DIR
        value: /app/data
      - key: ZEMY_SCANNER_ENABLED
        value: "true"
      - key: ZEMY_SCANNER_INTERVAL_HOURS
        value: "6"
      - key: ZEMY_SCANNER_PAGES_PER_CYCLE
        value: "5"
      - key: ZEMY_CACHE_TTL_HOURS
        value: "72"
    disk:
      name: zemy-persistent-data
      mountPath: /app/data
      sizeGB: 10
